<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17181d" />
  <title>Vida do Dev — office.exe</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="identity"><span class="mark">_</span><div><strong>vida<span>do</span>dev_</strong><small>OFFICE.EXE · NOVO MOTOR</small></div></div>
      <div class="release"><i></i> PHASER PREVIEW <span>1.0</span></div>
    </header>
    <main>
      <section class="stage-card" aria-label="Escritório animado">
        <div id="game"></div>
        <div class="stage-note" id="stageNote">Selecione um personagem e um destino.</div>
      </section>
      <aside class="panel">
        <p class="eyebrow">CONTROLE DE CENA</p>
        <label>Personagem
          <select id="character">
            <option value="guest">Visitante</option><option value="dev">O Dev</option>
            <option value="ana">Ana</option><option value="ops">Ops</option><option value="pm">PM</option>
          </select>
        </label>
        <div class="destinations" aria-label="Destinos">
          <button data-destination="entrance">Entrada</button>
          <button data-destination="lounge">Descompressão</button>
          <button data-destination="arcade">Fliperama</button>
        </div>
        <div class="status"><span id="statusName">PRONTO</span><p id="statusText">Novo sistema de rotas carregado.</p></div>
        <button class="pause" id="pause">Pausar</button>
      </aside>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
